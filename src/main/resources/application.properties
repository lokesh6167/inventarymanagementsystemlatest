# ============================================
# Local persistent H2 database
# Desktop launcher sets INVENTORY_DB_DIR to the current user's Local AppData folder.
# The relative fallback supports local backend development.
# ============================================
spring.datasource.url=jdbc:h2:file:${INVENTORY_DB_DIR:./inventory_data}/inventary_management_system;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console is for development/debugging only; disabled in the desktop app.
spring.h2.console.enabled=false

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Configuration
server.address=127.0.0.1
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allow-credentials=true
